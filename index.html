<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3729">
<title>The Only Connection You Need Is With Jesus</title>
<meta property="og:title" content="The only connection you need is with Jesus!">
<meta property="og:image" content="anniversary.jpg?v=3">
<style>
  html, body { margin: 0; height: 100%; background: #2b3729; overflow: hidden; }

  /* Full-screen stage: centers the picture horizontally and vertically on any device */
  .stage {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #2b3729;
  }

  /* Wrapper hugs the picture. Its ::before continues the picture's own colours
     (orange at the top, dark green at the bottom) above, below and beside it,
     so there are no bars and no blur on any screen shape. */
  .frame { position: relative; line-height: 0; }
  .frame::before {
    content: "";
    position: absolute;
    left: -100vw; right: -100vw; top: -100vh; bottom: -100vh;
    background: linear-gradient(to bottom,
      #df6b20 100vh,
      #bd6120 calc(100vh + (100% - 200vh) * .22),
      #915523 calc(100vh + (100% - 200vh) * .37),
      #664824 calc(100vh + (100% - 200vh) * .52),
      #473f28 calc(100vh + (100% - 200vh) * .67),
      #323927 calc(100vh + (100% - 200vh) * .82),
      #2b3729 calc(100% - 100vh));
  }

  /* The picture keeps its proportions and shrinks to fit the screen, never cropped or stretched */
  .pic {
    position: relative;
    display: block;
    width: auto;
    height: auto;
    max-width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
    max-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    object-fit: contain;
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="frame">
      <img class="pic" src="anniversary.jpg?v=3" alt="The only connection you need is with Jesus! Happy anniversary, church fam!">
    </div>
  </main>
</body>
</html>
