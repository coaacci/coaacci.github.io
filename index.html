<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3729">
<title>The Only Connection You Need Is With Jesus</title>
<meta property="og:title" content="The only connection you need is with Jesus!">
<meta property="og:image" content="anniversary.jpg?v=3">
<style>
  html, body { margin: 0; height: 100%; background: #2b3729; overflow: hidden; }

  /* ---------- Full-screen stage: picture centered on any device ---------- */
  .stage {
    position: fixed; inset: 0;
    height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #2b3729;
  }
  .frame { position: relative; line-height: 0; animation: flyIn 1.3s cubic-bezier(.16,.8,.24,1) 2.8s both; }
  .frame::before {
    content: ""; position: absolute;
    left: -100vw; right: -100vw; top: -100vh; bottom: -100vh;
    background: linear-gradient(to bottom,
      #df6b20 100vh,
      #bd6120 calc(100vh + (100% - 200vh) * .22),
      #915523 calc(100vh + (100% - 200vh) * .37),
      #664824 calc(100vh + (100% - 200vh) * .52),
      #473f28 calc(100vh + (100% - 200vh) * .67),
      #323927 calc(100vh + (100% - 200vh) * .82),
      #2b3729 calc(100% - 100vh));
  }
  .pic {
    position: relative; display: block; width: auto; height: auto;
    max-width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
    max-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    object-fit: contain;
  }
  /* Fly in from the bottom to the top with a fade, landing exactly centered */
  @keyframes flyIn {
    from { opacity: 0; transform: translateY(55vh); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- "Connecting to Church WiFi" intro ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; background: #14181a; color: #fff;
    font: 600 17px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .02em;
    animation: introOut .7s ease 2.6s both;
    pointer-events: none;
  }
  @keyframes introOut { to { opacity: 0; visibility: hidden; } }

  .wifi { width: 96px; height: 96px; overflow: visible; }
  .wifi .arc { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; opacity: .15; }
  .wifi .dot { fill: #fff; opacity: .15; }
  .wifi .a0 { animation: lit .3s ease .25s forwards; }
  .wifi .a1 { animation: lit .3s ease .65s forwards; }
  .wifi .a2 { animation: lit .3s ease 1.05s forwards; }
  .wifi .a3 { animation: lit .3s ease 1.45s forwards; }
  @keyframes lit { to { opacity: 1; } }
  .wifi { animation: pop .5s ease 1.9s both; }
  @keyframes pop { 50% { transform: scale(1.12); } }

  .labels { position: relative; height: 1.4em; width: 100%; text-align: center; }
  .labels span { position: absolute; left: 0; right: 0; }
  .l1 { animation: fadeOut .3s ease 1.8s forwards; }
  .l2 { opacity: 0; color: #7be08f; animation: fadeIn .3s ease 1.95s forwards; }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes fadeIn  { to { opacity: 1; } }
  .dots i { font-style: normal; animation: blink 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  /* Respect "reduce motion" settings: skip the intro, just show the picture */
  @media (prefers-reduced-motion: reduce) {
    .intro { display: none; }
    .frame { animation: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="frame">
      <img class="pic" src="anniversary.jpg?v=3" alt="The only connection you need is with Jesus! Happy anniversary, church fam!">
    </div>
  </main>

  <div class="intro" aria-hidden="true">
    <svg class="wifi" viewBox="0 0 100 100">
      <path class="arc a3" d="M8 38 Q50 -2 92 38"/>
      <path class="arc a2" d="M24 54 Q50 29 76 54"/>
      <path class="arc a1" d="M38 69 Q50 58 62 69"/>
      <circle class="dot a0" cx="50" cy="84" r="6"/>
    </svg>
    <div class="labels">
      <span class="l1">Connecting to Church WiFi<span class="dots"><i>.</i><i>.</i><i>.</i></span></span>
      <span class="l2">Connected ✓</span>
    </div>
  </div>
</body>
</html>
