<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181a">
<title>Church WiFi</title>
<meta property="og:title" content="Church WiFi">
<style>
  html, body { margin: 0; height: 100%; background: #14181a; overflow: hidden; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; -webkit-tap-highlight-color: transparent; }

  /* ================= The reveal (final page): centered on any device ================= */
  .stage {
    position: fixed; inset: 0; height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #2b3729;
  }
  .frame { position: relative; line-height: 0; opacity: 0; }
  .frame::before {
    content: ""; position: absolute;
    left: -100vw; right: -100vw; top: -100vh; bottom: -100vh;
    background: linear-gradient(to bottom,
      #df6b20 100vh,
      #bd6120 calc(100vh + (100% - 200vh) * .22),
      #915523 calc(100vh + (100% - 200vh) * .37),
      #664824 calc(100vh + (100% - 200vh) * .52),
      #473f28 calc(100vh + (100% - 200vh) * .67),
      #323927 calc(100vh + (100% - 200vh) * .82),
      #2b3729 calc(100% - 100vh));
  }
  .pic {
    position: relative; display: block; width: auto; height: auto;
    max-width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
    max-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    object-fit: contain;
  }
  body[data-phase="reveal"] .frame { animation: flyIn 1.3s cubic-bezier(.16,.8,.24,1) .15s both; }
  @keyframes flyIn {
    from { opacity: 0; transform: translateY(55vh); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ================= Portal + connecting screens ================= */
  .layer {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    box-sizing: border-box;
    background: radial-gradient(120% 90% at 50% 0%, #1f2a33 0%, #14181a 60%);
    transition: opacity .6s ease, visibility .6s;
  }
  body[data-phase="reveal"] .layer { opacity: 0; visibility: hidden; pointer-events: none; }

  .screen { display: none; width: 100%; max-width: 340px; flex-direction: column; align-items: center; text-align: center; }
  body[data-phase="portal"] #sPortal { display: flex; animation: rise .5s ease both; }
  body[data-phase="connecting"] #sConn,
  body[data-phase="connected"] #sConn { display: flex; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .logo { display: block; box-sizing: border-box; width: min(52vw, 190px); height: auto; padding: 8px; background: #fff; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  h1 { margin: 22px 0 4px; font-size: 24px; font-weight: 700; letter-spacing: .01em; }
  .sub { margin: 0 0 26px; color: #9fb0bb; font-size: 15px; }

  .btn {
    appearance: none; border: 0; width: 100%; padding: 16px 20px;
    font: inherit; font-weight: 700; font-size: 18px; letter-spacing: .02em; color: #fff;
    background: #e8721f; border-radius: 14px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(232,114,31,.35);
    position: relative; overflow: hidden;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.97); filter: brightness(.92); }
  /* thin bar that fills while the page auto-connects */
  .btn .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: rgba(255,255,255,.55); transform-origin: left; transform: scaleX(0); }
  body[data-phase="portal"] .btn .bar { animation: fill 3.4s linear .1s forwards; }
  @keyframes fill { to { transform: scaleX(1); } }

  .terms { margin: 18px 4px 0; color: #7d8d98; font-size: 12.5px; }

  /* connecting animation */
  .wifi { width: 96px; height: 96px; overflow: visible; }
  .wifi .arc { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; opacity: .15; }
  .wifi .dot { fill: #fff; opacity: .15; }
  body[data-phase="connecting"] .a0, body[data-phase="connected"] .a0 { animation: lit .3s ease .05s forwards; }
  body[data-phase="connecting"] .a1, body[data-phase="connected"] .a1 { animation: lit .3s ease .40s forwards; }
  body[data-phase="connecting"] .a2, body[data-phase="connected"] .a2 { animation: lit .3s ease .75s forwards; }
  body[data-phase="connecting"] .a3, body[data-phase="connected"] .a3 { animation: lit .3s ease 1.10s forwards; }
  @keyframes lit { to { opacity: 1; } }
  body[data-phase="connected"] .wifi { animation: pop .5s ease both; }
  @keyframes pop { 50% { transform: scale(1.12); } }

  .labels { position: relative; height: 1.5em; width: 100%; margin-top: 22px; font-weight: 600; font-size: 17px; letter-spacing: .02em; }
  .labels span { position: absolute; left: 0; right: 0; }
  .l2 { opacity: 0; color: #7be08f; }
  body[data-phase="connected"] .l1 { opacity: 0; transition: opacity .25s; }
  body[data-phase="connected"] .l2 { opacity: 1; transition: opacity .25s .1s; }
  .dots i { font-style: normal; animation: blink 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    body[data-phase="reveal"] .frame { opacity: 1; }
    .btn .bar { display: none; }
  }
  @media (max-height: 520px) { .logo { width: 90px; } h1 { margin-top: 12px; } .sub { margin-bottom: 14px; } .terms { margin-top: 10px; } }
</style>

  <script>
  (function () {
    var b = document.body, started = false, timers = [];
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
    function go() {
      if (started) return; started = true;
      timers.forEach(clearTimeout);
      if (reduce) { b.dataset.phase = "reveal"; return; }
      b.dataset.phase = "connecting";
      at(1600, function () { b.dataset.phase = "connected"; });
      at(2400, function () { b.dataset.phase = "reveal"; });
    }
    document.getElementById("connect").addEventListener("click", go);
    at(3600, go);   // auto-connect if nobody taps
  })();
  </script>
